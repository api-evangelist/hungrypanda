apis:
- aid: hungrypanda:merchant-api
  name: HungryPanda Merchant & Partner API
  description: 'The regionally partitioned HTTP API behind the HungryPanda merchant back office
    (merchant.hungrypanda.co) and the POS/middleware partner integrations. It carries merchant
    onboarding and authentication, shop/ERP administration, menu synchronisation, order injection
    and order-status callbacks. Every request is authenticated; an unauthenticated call to any
    path returns HTTP 200 with the JSON envelope {"code":40001}. No public specification, developer
    portal or self-service sign-up exists — App Key, Secret Key and ShopID are issued by
    HungryPanda to approved merchants and POS partners.'
  humanURL: https://www.hungrypanda.co/merchants/
