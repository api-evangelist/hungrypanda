aid: hungrypanda
name: HungryPanda
description: 'HungryPanda (熊猫外卖) is the largest Asian food delivery platform serving overseas
  Chinese communities, founded in Nottingham, UK in 2017 and headquartered in London. It operates
  a marketplace app, a rider delivery network, the Panda Fresh Asian grocery e-commerce platform
  and the VouchersPanda lifestyle-deals platform across more than 80 cities in ten countries
  (UK, France, Italy, USA, Canada, Australia, New Zealand, Japan, South Korea and Singapore).
  Its API surface is a regionally partitioned merchant/partner ordering platform used by POS and
  middleware integrators — Deliverect, Otter, Neopos, Hubster, Menusifu, Easy Cloud and Redcat —
  to inject HungryPanda orders into a restaurant point of sale, push order-status updates back,
  and sync menus. Integration credentials (App Key, Secret Key, ShopID) are issued by HungryPanda
  on a partner basis; there is no public developer portal, no published specification and no
  self-service sign-up.'
